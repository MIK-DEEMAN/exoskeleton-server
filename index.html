<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Finger Exoskeleton Dashboard</title>
<style>
/* ── Reset & Variables ── */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg:       #0b0c10;
  --surface:  #15171e;
  --surface2: #1c1f28;
  --border:   rgba(255,255,255,0.07);
  --text:     #eef0f4;
  --muted:    #8a8f9c;
  --blue:     #4f8cff;
  --cyan:     #22d3ee;
  --green:    #34d399;
  --red:      #f87171;
  --yellow:   #fbbf24;
  --purple:   #a78bfa;
  --pink:     #f472b6;
  --radius:   16px;
}
html { scroll-behavior: smooth; }
body {
  font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
  background:
    radial-gradient(1200px 500px at 80% -10%, rgba(79,140,255,.08), transparent 60%),
    radial-gradient(900px 400px at 0% 110%, rgba(167,139,250,.06), transparent 60%),
    var(--bg);
  color: var(--text);
  min-height: 100vh;
  padding: 14px;
  max-width: 1100px;
  margin: 0 auto;
}

/* ── Header ── */
.header {
  display: flex; align-items: center; justify-content: space-between;
  flex-wrap: wrap; gap: 10px;
  margin-bottom: 14px; padding: 14px 16px;
  background: var(--surface); border: 0.5px solid var(--border);
  border-radius: var(--radius);
}
.header h1 { font-size: 16px; font-weight: 600; letter-spacing: .01em; }
.header .sub { font-size: 11px; color: var(--muted); margin-top: 2px; }
.pills { display: flex; gap: 8px; flex-wrap: wrap; }

/* ── Status Pills ── */
.status-pill {
  display: inline-flex; align-items: center; gap: 6px;
  font-size: 11.5px; font-weight: 600; padding: 6px 12px;
  border-radius: 99px; border: 0.5px solid var(--border);
}
.status-pill .dot { width: 7px; height: 7px; border-radius: 50%; }
.status-connected    { background: rgba(52,211,153,.10);  color: var(--green); }
.status-disconnected { background: rgba(248,113,113,.10); color: var(--red); }
.status-connecting   { background: rgba(251,191,36,.10);  color: var(--yellow); }
.status-connected    .dot { background: var(--green); box-shadow: 0 0 8px rgba(52,211,153,.8); }
.status-disconnected .dot { background: var(--red); }
.status-connecting   .dot { background: var(--yellow); animation: blink 1s infinite; }
@keyframes blink { 0%,100%{opacity:1} 50%{opacity:.2} }

/* ── Layout Grid ── */
.grid { display: grid; gap: 12px; margin-bottom: 12px; }
.grid-two   { grid-template-columns: 1fr 1fr; }
.grid-stats { grid-template-columns: repeat(3, 1fr); }
@media (max-width: 760px) {
  .grid-two { grid-template-columns: 1fr; }
  .grid-stats { grid-template-columns: 1fr; }
}

/* ── Cards ── */
.card {
  background: var(--surface); border: 0.5px solid var(--border);
  border-radius: var(--radius); padding: 16px;
}
.card-label {
  font-size: 11px; color: var(--muted); letter-spacing: .06em;
  text-transform: uppercase; margin-bottom: 8px; font-weight: 600;
}
.ch-title { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
.ch-title .tag {
  font-size: 11px; font-weight: 700; padding: 3px 9px; border-radius: 7px;
}
.ch0 .tag { background: rgba(79,140,255,.15); color: var(--blue); }
.ch1 .tag { background: rgba(167,139,250,.15); color: var(--purple); }
.ch-title h2 { font-size: 13px; font-weight: 600; }

.stat-value { font-size: 28px; font-weight: 600; line-height: 1.05; font-variant-numeric: tabular-nums; }
.stat-unit  { font-size: 11.5px; color: var(--muted); margin-top: 5px; }
.stat-accent-green  .stat-value { color: var(--green); }

/* ── Gauges ── */
.gauge-wrap { display: flex; align-items: flex-start; justify-content: space-around; gap: 8px; flex-wrap: wrap; }
.gauge-box  { text-align: center; }
.gauge-box svg { display: block; margin: 0 auto; }
.gauge-cap  { font-size: 11px; color: var(--muted); margin-top: 2px; }
.gauge-val  { font-size: 20px; font-weight: 600; fill: var(--text); }
.fsr-readout { text-align: center; margin-top: 10px; padding-top: 10px; border-top: 0.5px solid var(--border); }
.lock-badge {
  display: inline-flex; align-items: center; gap: 5px;
  font-size: 11px; font-weight: 600; padding: 3px 10px; border-radius: 99px;
  margin-top: 6px; border: 0.5px solid var(--border);
}
.lock-on  { background: rgba(251,191,36,.10); color: var(--yellow); }
.lock-off { background: rgba(255,255,255,.04); color: var(--muted); }

/* ── Buttons ── */
button {
  padding: 10px 16px; border-radius: 11px; border: 0.5px solid var(--border);
  background: var(--surface2); cursor: pointer; font-size: 13px; font-weight: 500;
  color: var(--text); transition: transform .1s, background .15s, opacity .15s;
  font-family: inherit;
}
button:hover:not(:disabled) { background: rgba(255,255,255,.08); }
button:active:not(:disabled) { transform: scale(.97); }
button:disabled { opacity: .32; cursor: not-allowed; }
.btn-primary { background: var(--blue); border-color: transparent; }
.btn-primary:hover:not(:disabled) { background: #3b78f0; }
.btn-open  { background: rgba(52,211,153,.13); color: var(--green); border-color: rgba(52,211,153,.25); }
.btn-close { background: rgba(248,113,113,.13); color: var(--red);  border-color: rgba(248,113,113,.25); }
.btn-row { display: flex; gap: 8px; flex-wrap: wrap; }

/* ── Slider ── */
.slider-wrap { display: flex; align-items: center; gap: 12px; margin: 10px 0; }
.slider-wrap label { font-size: 12px; color: var(--muted); min-width: 60px; }
input[type=range] { flex: 1; accent-color: var(--blue); height: 4px; }
.s1 input[type=range] { accent-color: var(--purple); }
.slider-val { font-size: 16px; font-weight: 600; min-width: 50px; text-align: right; font-variant-numeric: tabular-nums; }
.lock-row { display: flex; align-items: center; gap: 8px; margin: 8px 0 4px; }
.lock-row label { font-size: 12px; color: var(--muted); }
.lock-row input { width: 15px; height: 15px; accent-color: var(--blue); }

/* ── Voice ── */
.voice-row { display: flex; align-items: center; gap: 12px; }
.mic-btn {
  width: 52px; height: 52px; border-radius: 50%; font-size: 22px;
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0; padding: 0;
}
.mic-btn.on { background: rgba(248,113,113,.16); border-color: var(--red);
  animation: pulse 1.2s ease-in-out infinite; }
@keyframes pulse { 0%,100%{transform:scale(1)} 50%{transform:scale(1.08)} }
.voice-text { font-size: 13px; color: var(--muted); font-style: italic; flex: 1; line-height: 1.5; }
.voice-hints { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 10px; }
.voice-hints span {
  font-size: 11px; color: var(--muted); padding: 3px 10px;
  background: rgba(255,255,255,.04); border-radius: 99px; border: 0.5px solid var(--border);
}

/* ── Log ── */
.log-box {
  background: #07080b; border-radius: 11px; padding: 10px 12px;
  font-family: Consolas, monospace; font-size: 11px; line-height: 1.7;
  height: 150px; overflow-y: auto; border: 0.5px solid var(--border);
  white-space: pre-wrap; word-break: break-all;
}
.log-in  { color: var(--green); }
.log-out { color: var(--blue); }
.log-sys { color: var(--muted); }
.log-err { color: var(--red); }

/* ── meta ── */
.meta-row { display: flex; justify-content: space-between; align-items: center; }
.rate-tag { font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums; }
</style>
</head>
<body>

<!-- ═══ Header ═══ -->
<div class="header">
  <div>
    <h1>Finger Exoskeleton</h1>
    <div class="sub">ESP32 · 2 ช่อง (Servo×2) · Render WebSocket</div>
  </div>
  <div class="pills">
    <div class="status-pill status-disconnected" id="ws-status">
      <span class="dot"></span><span id="ws-text">Server</span>
    </div>
    <div class="status-pill status-disconnected" id="esp-status">
      <span class="dot"></span><span id="esp-text">ESP32</span>
    </div>
  </div>
</div>

<!-- ═══ Two Channel Cards ═══ -->
<div class="grid grid-two" id="channel-cards"></div>

<!-- ═══ Data status ═══ -->
<div class="grid grid-two">
  <div class="card stat-accent-green">
    <div class="card-label">สถานะการส่งข้อมูล</div>
    <div class="stat-value" id="val-age" style="font-size:24px">—</div>
    <div class="stat-unit" id="val-pkts">0 แพ็กเก็ต</div>
  </div>
  <div class="card">
    <div class="meta-row"><div class="card-label" style="margin:0">อัตราการส่ง</div></div>
    <div class="stat-value" id="val-hz" style="font-size:24px">— Hz</div>
    <div class="stat-unit">ปกติ ~10 Hz</div>
  </div>
</div>

<!-- ═══ Controls (per-channel) + Voice ═══ -->
<div class="grid grid-two">
  <div class="card">
    <div class="card-label" style="margin-bottom:8px">ควบคุม Servo</div>

    <div class="slider-wrap s0">
      <label>ช่อง 1 องศา</label>
      <input type="range" id="angle0" min="0" max="180" value="0"
        oninput="document.getElementById('angle0-out').textContent=this.value+'°'">
      <span class="slider-val" id="angle0-out">0°</span>
    </div>
    <div class="slider-wrap s1">
      <label>ช่อง 2 องศา</label>
      <input type="range" id="angle1" min="0" max="180" value="0"
        oninput="document.getElementById('angle1-out').textContent=this.value+'°'">
      <span class="slider-val" id="angle1-out">0°</span>
    </div>
    <div class="lock-row">
      <input type="checkbox" id="lock-check" checked>
      <label for="lock-check">ล็อกตำแหน่งหลังเคลื่อนที่</label>
    </div>
    <div class="btn-row">
      <button class="btn-primary" onclick="sendAngle(0)" id="btn-send0" disabled>ส่งช่อง 1</button>
      <button class="btn-primary" onclick="sendAngle(1)" id="btn-send1" disabled>ส่งช่อง 2</button>
    </div>
    <div class="btn-row" style="margin-top:8px">
      <button class="btn-open"  onclick="quickCmd('open')"  id="btn-open"  disabled>เปิดทั้งคู่</button>
      <button class="btn-close" onclick="quickCmd('close')" id="btn-close" disabled>กำทั้งคู่</button>
      <button onclick="quickCmd('grip',50)"  id="btn-grip50"  disabled>Grip 50%</button>
      <button onclick="quickCmd('grip',100)" id="btn-grip100" disabled>Grip 100%</button>
    </div>
  </div>

  <div class="card">
    <div class="card-label" style="margin-bottom:12px">สั่งงานด้วยเสียง</div>
    <div class="voice-row">
      <button class="mic-btn" id="mic-btn" onclick="toggleVoice()" title="กดพูดคำสั่ง">🎤</button>
      <span class="voice-text" id="voice-text">กดไมค์แล้วพูดคำสั่งภาษาไทย</span>
    </div>
    <div class="voice-hints">
      <span>"จับ" = กำนิ้วเข้าจับ</span><span>"ปล่อย" = คลายนิ้วกลับ</span>
    </div>
  </div>
</div>

<!-- ═══ Log ═══ -->
<div class="card">
  <div class="meta-row" style="margin-bottom:8px">
    <div class="card-label" style="margin:0">WebSocket Log</div>
    <button style="font-size:11px;padding:4px 12px" onclick="clearLog()">ล้าง</button>
  </div>
  <div class="log-box" id="ws-log"><span class="log-sys">// รอการเชื่อมต่อ...</span></div>
</div>

<script>
// ── CONFIG — Render (free tier) ───────────────────────────────
const SERVER_URL = "wss://exoskeleton-server.onrender.com/dashboard";
const HEALTH_URL = "https://exoskeleton-server.onrender.com/";  // ใช้ปลุก server ตอนหลับ

// ── 2 ช่อง: สีประจำช่อง ───────────────────────────────────────
const CH = [
  { name: 'ช่อง 1', servo: '#4f8cff', cls: 'ch0' },
  { name: 'ช่อง 2', servo: '#a78bfa', cls: 'ch1' },
];

// ── สร้างการ์ดต่อช่อง (servo gauge + flex gauge + FSR) ────────
const ARC_LEN = 235.6; // ความยาวเส้นโค้งครึ่งวงกลม r=75
document.getElementById('channel-cards').innerHTML = CH.map((c, i) => `
  <div class="card ${c.cls}">
    <div class="ch-title"><span class="tag">${c.name}</span><h2>Servo</h2></div>
    <div class="gauge-wrap">
      ${gaugeSVG('servo'+i, c.servo, '0–180°')}
    </div>
    <div class="gauge-wrap" style="margin-top:2px">
      <div class="gauge-cap">Servo (0–180°)</div>
    </div>
    <div class="fsr-readout">
      <span class="lock-badge lock-off" id="lock${i}">ปลดล็อก</span>
    </div>
  </div>
`).join('');

function gaugeSVG(id, color, cap) {
  return `<div class="gauge-box">
    <svg width="150" height="98" viewBox="0 0 200 120">
      <path d="M 25 105 A 75 75 0 0 1 175 105" fill="none"
            stroke="rgba(255,255,255,0.08)" stroke-width="12" stroke-linecap="round"/>
      <path id="${id}-arc" d="M 25 105 A 75 75 0 0 1 175 105" fill="none"
            stroke="${color}" stroke-width="12" stroke-linecap="round"
            stroke-dasharray="${ARC_LEN}" stroke-dashoffset="${ARC_LEN}"/>
      <line id="${id}-needle" x1="100" y1="105" x2="100" y2="48"
            stroke="#eef0f4" stroke-width="3" stroke-linecap="round"
            transform="rotate(-90 100 105)"/>
      <circle cx="100" cy="105" r="6" fill="#eef0f4"/>
      <text x="100" y="92" text-anchor="middle" class="gauge-val" id="${id}-text">0°</text>
    </svg>
  </div>`;
}

function setGauge(prefix, value, max) {
  const ratio = Math.min(max, Math.max(0, value)) / max;
  const arc = document.getElementById(prefix + '-arc');
  const ndl = document.getElementById(prefix + '-needle');
  const txt = document.getElementById(prefix + '-text');
  if (!arc) return;
  arc.setAttribute('stroke-dashoffset', ARC_LEN * (1 - ratio));
  ndl.setAttribute('transform', `rotate(${-90 + ratio * 180} 100 105)`);
  txt.textContent = Math.round(value) + '°';
}
function updateLock(i, locked) {
  const el = document.getElementById('lock' + i);
  el.className = 'lock-badge ' + (locked ? 'lock-on' : 'lock-off');
  el.textContent = locked ? 'ล็อกอยู่' : 'ปลดล็อก';
}

// ── Packet rate + ความสดของข้อมูล ─────────────────────────────
let pktCount = 0, pktWindow = 0, lastPktTime = 0;
setInterval(() => {
  document.getElementById('val-hz').textContent = pktWindow + ' Hz';
  pktWindow = 0;
  const ageEl = document.getElementById('val-age');
  if (!lastPktTime) { ageEl.textContent = '—'; return; }
  const sec = (Date.now() - lastPktTime) / 1000;
  ageEl.textContent = sec < 1.5 ? 'ปัจจุบัน' : 'ล่าช้า';
  ageEl.style.color = sec < 3 ? 'var(--green)' : 'var(--yellow)';
}, 1000);

// ── Log ───────────────────────────────────────────────────────
function log(msg, cls = 'log-sys') {
  const el = document.getElementById('ws-log');
  const ts = new Date().toLocaleTimeString('th-TH', { hour12: false });
  el.innerHTML += `\n<span class="${cls}">[${ts}] ${msg}</span>`;
  el.scrollTop = el.scrollHeight;
}
function clearLog() {
  document.getElementById('ws-log').innerHTML = '<span class="log-sys">// cleared</span>';
}

// ── Status Pills + ปุ่ม ───────────────────────────────────────
function setWsStatus(s, txt) {
  const el = document.getElementById('ws-status');
  document.getElementById('ws-text').textContent =
    txt || (s === 'connected' ? 'Server: Online' : s === 'connecting' ? 'Server: กำลังเชื่อมต่อ' : 'Server: Offline');
  el.className = 'status-pill status-' + s;
}
function setEspStatus(online) {
  const el = document.getElementById('esp-status');
  document.getElementById('esp-text').textContent = online ? 'ESP32: Online' : 'ESP32: Offline';
  el.className = 'status-pill status-' + (online ? 'connected' : 'disconnected');
  setButtons(online);
}
function setButtons(en) {
  ['btn-send0','btn-send1','btn-open','btn-close','btn-grip50','btn-grip100']
    .forEach(id => document.getElementById(id).disabled = !en);
}

// ── แปลงค่าเป็น array 2 ช่องเสมอ (รองรับทั้งค่าเดี่ยวเก่า + array ใหม่) ──
function as2(v) {
  if (Array.isArray(v)) return [v[0], v[1]];
  return [v, undefined]; // รูปแบบเก่า: ค่าเดียว = ช่อง 1
}

// ── WebSocket ─────────────────────────────────────────────────
// Render free tier: server หลับเมื่อไม่มีการใช้งาน ~15 นาที
// ตื่นครั้งแรกใช้เวลา ~50 วิ → ยิง HTTP ปลุกควบคู่ + retry จนกว่าจะติด
let ws, connectTries = 0;

function connect() {
  connectTries++;
  if (connectTries === 1) {
    setWsStatus('connecting');
    log('→ Connecting to server...');
  } else {
    setWsStatus('connecting', 'Server: กำลังปลุก...');
    log(`→ ปลุก server + ลองใหม่ (ครั้งที่ ${connectTries}) — Render free ตื่นใน ~50 วิ`);
  }
  fetch(HEALTH_URL).catch(() => {});   // HTTP ping ช่วยปลุก instance ที่หลับอยู่

  ws = new WebSocket(SERVER_URL);

  ws.onopen = () => {
    connectTries = 0;
    setWsStatus('connected');
    log('Server connected', 'log-in');
  };

  ws.onmessage = (e) => {
    let data;
    try { data = JSON.parse(e.data); } catch { return; }
    handleMessage(data);
    if (data.type !== 'sensor_data') log(`← ${e.data.slice(0, 90)}`, 'log-in');
  };

  ws.onclose = () => {
    setEspStatus(false);
    if (connectTries === 0) {
      // เคยต่อติดแล้วหลุด → แจ้งชัดเจน
      setWsStatus('disconnected');
      log('Disconnected — reconnecting in 3s...', 'log-err');
    }
    setTimeout(connect, 3000);
  };

  ws.onerror = () => { if (connectTries <= 1) log('Connection error', 'log-err'); };
}

// ── Handle Message จาก Server ────────────────────────────────
function handleMessage(data) {
  if (data.type === 'sensor_data') {
    pktCount++; pktWindow++; lastPktTime = Date.now();
    document.getElementById('val-pkts').textContent = pktCount.toLocaleString() + ' แพ็กเก็ต';

    const servo = as2(data.servo);
    const lock  = as2(data.lock);

    for (let i = 0; i < 2; i++) {
      setGauge('servo' + i, +servo[i] || 0, 180);
      updateLock(i, !!lock[i]);
    }
    setButtons(true);
  }
  else if (data.type === 'esp32_status') {
    const online = data.status === 'connected';
    setEspStatus(online);
    log(`ESP32 ${online ? 'Online' : 'Offline'}`, online ? 'log-in' : 'log-err');
  }
  else if (data.type === 'hello') {
    log(`${data.device || 'ESP32'} v${data.version || '?'} เชื่อมต่อแล้ว`, 'log-in');
  }
  else if (data.type === 'error') {
    log(data.message, 'log-err');
  }
}

// ── Send Command ──────────────────────────────────────────────
function send(data) {
  if (!ws || ws.readyState !== WebSocket.OPEN) return;
  const msg = JSON.stringify(data);
  ws.send(msg);
  log(`→ ${msg}`, 'log-out');
}
function sendAngle(ch) {
  const angle = parseInt(document.getElementById('angle' + ch).value);
  const lock  = document.getElementById('lock-check').checked;
  send({ type: 'command', action: 'angle', ch, angle, lock });
}
function quickCmd(action, intensity = 100) {
  // ไม่ใส่ ch = สั่งทั้ง 2 ช่องพร้อมกัน
  send({ type: 'command', action, intensity });
}

// ── Voice Command ─────────────────────────────────────────────
const VOICE_LISTEN_MS = 5000;   // เวลาฟังเสียงต่อครั้ง (5 วินาที)
let recognition, voiceActive = false, voiceTimer = null, voiceEndAt = 0;

function toggleVoice() {
  if (!('webkitSpeechRecognition' in window || 'SpeechRecognition' in window)) {
    alert('ใช้ Chrome เพื่อรองรับ Voice Command');
    return;
  }
  if (voiceActive) { stopVoice(); return; }   // กดซ้ำ = หยุดก่อนเวลา

  voiceActive = true;
  voiceEndAt  = Date.now() + VOICE_LISTEN_MS;
  document.getElementById('mic-btn').classList.add('on');
  startRecognition();
  voiceTimer = setTimeout(stopVoice, VOICE_LISTEN_MS);   // หยุดอัตโนมัติหลัง 5 วิ
}

function startRecognition() {
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  recognition = new SR();
  recognition.lang = 'th-TH';
  recognition.interimResults = true;
  recognition.continuous = true;

  recognition.onstart = () => {
    document.getElementById('voice-text').textContent = '🎙 กำลังฟัง...';
  };

  recognition.onresult = (e) => {
    let t = '';
    for (let i = e.resultIndex; i < e.results.length; i++)
      t = e.results[i][0].transcript;
    document.getElementById('voice-text').textContent = `"${t}"`;

    if (e.results[e.resultIndex].isFinal) {
      send({ type: 'voice', text: t });
      log(`[เสียง] "${t}"`, 'log-out');
    }
  };

  recognition.onerror = (ev) => {
    if (ev.error === 'not-allowed' || ev.error === 'service-not-allowed') {
      stopVoice();
      alert('ไม่ได้รับอนุญาตให้ใช้ไมโครโฟน — กด Allow ตอนเบราว์เซอร์ถาม');
    }
    // no-speech / aborted → ปล่อยให้ onend จัดการฟังต่อ
  };

  // ถ้า recognition หยุดเองตอนเงียบ แต่ยังไม่ครบ 5 วิ → เริ่มฟังต่อ
  recognition.onend = () => {
    if (voiceActive && Date.now() < voiceEndAt) startRecognition();
  };

  try { recognition.start(); } catch (e) {}
}

function stopVoice() {
  voiceActive = false;
  if (voiceTimer) { clearTimeout(voiceTimer); voiceTimer = null; }
  document.getElementById('mic-btn').classList.remove('on');
  document.getElementById('voice-text').textContent = 'กดไมค์แล้วพูดคำสั่งภาษาไทย';
  try { recognition?.stop(); } catch (e) {}
}

// ── Start ─────────────────────────────────────────────────────
connect();
</script>
</body>
</html>
